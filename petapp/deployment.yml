apiVersion: apps/v1
kind: Deployment
metadata:
  name: petapp-deployment-devops
  namespace: petapp
spec:
  replicas: 1 # You can change the number of replicas as needed
  selector:
    matchLabels:
      app: petapp  # This label should match the selector in the Service
  template:
    metadata:
      labels:
        app: petapp  # This label should match the selector in the Service
    spec:
      containers:
      - name: petapp
        image: tobadocker12/petapp:4823fafaaeb05211be584ee8a449c54213114060  # You can specify a different version if needed
        ports:
        - containerPort: 8080  # This should match the targetPort in the Service

